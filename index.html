<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>رفقای جنگجو - GDD Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #08060c;
            --accent-gold: #f39c12;
            --accent-cyan: #00d2d3;
            --accent-red: #ff4757;
            --accent-green: #2ed573;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-screen {
            width: 100%;
            height: 100dvh;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .shake {
            animation: shakeScreen 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeScreen {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .scene {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
        }

        .scene.active {
            display: flex;
        }

        /* --- LANDING SCENE --- */
        #landing-scene {
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
            text-align: center;
            background: radial-gradient(circle, #1a1528 0%, #08060c 100%);
        }

        .game-logo {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.6);
        }

        .menu-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 280px;
        }

        .btn-menu {
            background: linear-gradient(135deg, #2c2c54, #40407a);
            border: 2px solid var(--accent-cyan);
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-menu.primary {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-color: var(--accent-gold);
        }

        .p2p-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #181528;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #3d3d6b;
        }

        .p2p-input {
            background: #0d0b18;
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 2px;
            outline: none;
        }

        /* --- SELECTION SCENE --- */
        #select-scene {
            padding: 16px;
            gap: 12px;
            background: #0f0c1b;
        }

        .header-title {
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .card {
            background: #181528;
            border: 2px solid #332d52;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 60px;
            object-fit: contain;
        }

        .card-name {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-top: 2px;
        }

        .card-ability {
            font-size: 0.6rem;
            color: var(--accent-cyan);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .card.selected {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
            background: #251f3d;
        }

        .btn-start {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-start.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- BATTLE ARENA --- */
        #battle-scene {
            justify-content: space-between;
            background: radial-gradient(circle, #1a102f 0%, #0d0814 100%);
        }

        .status-banner {
            text-align: center;
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: bold;
            padding: 6px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            border-bottom: 1px solid rgba(243, 156, 18, 0.2);
        }

        .arena {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            padding: 10px 15px;
            position: relative;
            z-index: 5;
        }

        .team-side {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            min-height: 130px;
        }

        .full-character {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .char-sprite-wrap {
            position: relative;
            width: 70px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .char-sprite {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.7));
            animation: idleBreath 2.8s infinite ease-in-out;
            transform-origin: bottom center;
            transition: filter 0.3s;
        }

        .enemy-side .char-sprite {
            transform: scaleY(-1) rotate(180deg);
            animation: idleBreathEnemy 2.8s infinite ease-in-out;
        }

        .shadow-ellipse {
            position: absolute;
            bottom: -5px;
            width: 45px;
            height: 8px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            filter: blur(3px);
        }

        .char-hud {
            position: absolute;
            top: -35px;
            width: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .enemy-side .char-hud {
            top: auto;
            bottom: -35px;
        }

        .char-name-label {
            font-size: 0.65rem;
            font-weight: bold;
            text-shadow: 0 0 4px #000;
            white-space: nowrap;
        }

        .bar-bg {
            width: 100%;
            height: 5px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .hp-fill {
            height: 100%;
            width: 100%;
            background: var(--accent-green);
            transition: width 0.3s ease;
        }

        .mana-fill {
            height: 100%;
            width: 100%;
            background: var(--accent-blue);
            transition: width 0.3s ease;
        }

        .full-character.active-turn .char-sprite {
            filter: drop-shadow(0 0 14px var(--accent-gold));
        }

        .full-character.target-selected .char-sprite {
            filter: drop-shadow(0 0 14px #ffffff);
        }

        .full-character.using-ability .char-sprite {
            filter: drop-shadow(0 0 22px var(--accent-purple)) brightness(1.3);
        }

        @keyframes idleBreath {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes idleBreathEnemy {
            0%, 100% { transform: scaleY(-1) rotate(180deg) translateY(0); }
            50% { transform: scaleY(-1) rotate(180deg) translateY(-4px); }
        }

        .attack-down-anim {
            animation: animAttackDown 0.5s ease-in-out forwards !important;
            z-index: 100 !important;
        }

        @keyframes animAttackDown {
            0% { transform: translate(0, 0); }
            50% { transform: translate(0, 140px) scale(1.2); }
            100% { transform: translate(0, 0); }
        }

        .attack-up-anim {
            animation: animAttackUp 0.5s ease-in-out forwards !important;
            z-index: 100 !important;
        }

        @keyframes animAttackUp {
            0% { transform: translate(0, 0); }
            50% { transform: translate(0, -140px) scale(1.2); }
            100% { transform: translate(0, 0); }
        }

        .hurt-anim {
            animation: animHurt 0.35s ease-in-out !important;
        }

        @keyframes animHurt {
            0%, 100% { filter: none; }
            25% { filter: brightness(2.5) sepia(1) hue-rotate(-50deg); transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }

        .action-bar {
            background: rgba(15, 12, 27, 0.95);
            border-top: 1px solid #3d3d6b;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
            z-index: 20;
        }

        .action-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .btn-action {
            flex: 1;
            padding: 10px 6px;
            background: #2c2c54;
            border: 1px solid #40407a;
            color: #fff;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .btn-action.special {
            background: linear-gradient(135deg, #8e44ad, #2c3e50);
            border-color: var(--accent-purple);
        }

        .btn-action:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-subtext {
            font-size: 0.6rem;
            color: #ccc;
            font-weight: normal;
        }

        .pop-dmg {
            position: fixed;
            font-size: 1.6rem;
            font-weight: 900;
            color: #ff3838;
            text-shadow: 0 0 8px #000, 2px 2px 0px #fff;
            pointer-events: none;
            animation: popUp 1.1s ease-out forwards;
            z-index: 200;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: translateY(10px) scale(0.6); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.3); }
            80% { opacity: 1; transform: translateY(-40px) scale(1); }
            100% { opacity: 0; transform: translateY(-65px) scale(0.8); }
        }
    </style>
</head>
<body>

<div id="game-screen">
    <!-- LANDING SCENE -->
    <div id="landing-scene" class="scene active">
        <div class="game-logo">⚔️ رفقای جنگجو</div>
        <div class="menu-box">
            <button class="btn-menu primary" onclick="initMode('single')">🤖 بازی با هوش مصنوعی</button>
            <button class="btn-menu" onclick="createRoom()">🏠 ساخت اتاق دونفره</button>
            
            <div class="p2p-box">
                <input type="text" id="room-code-input" class="p2p-input" placeholder="کد ۶ رقمی..." maxlength="6">
                <button class="btn-menu" onclick="joinRoom()">🎮 ورود به اتاق حریف</button>
            </div>
        </div>
        <div id="room-status" style="font-size:0.85rem; color:var(--accent-cyan); min-height: 20px;"></div>
    </div>

    <!-- SELECTION SCENE -->
    <div id="select-scene" class="scene">
        <div class="header-title">⚔️ ۳ کاراکتر برای تیم خود انتخاب کنید</div>
        <div class="roster-grid" id="roster"></div>
        <button class="btn-start" id="start-btn" onclick="confirmTeam()">تایید تیم و ورود به آرنا ⚔️</button>
    </div>

    <!-- BATTLE SCENE -->
    <div id="battle-scene" class="scene">
        <div class="status-banner" id="status-text">در حال آماده‌سازی...</div>
        
        <div class="arena">
            <div class="team-side enemy-side" id="enemy-team"></div>
            <div class="team-side" id="player-team"></div>
        </div>

        <div class="action-bar">
            <div class="action-row">
                <button class="btn-action" id="btn-atk" onclick="handleAction('attack')">
                    <span>⚔️ حمله معمولی</span>
                </button>
                <button class="btn-action" id="btn-def" onclick="handleAction('defend')">
                    <span>🛡️ دفاع</span>
                </button>
            </div>
            <div class="action-row">
                <button class="btn-action special" id="btn-ability" onclick="handleAction('ability')">
                    <span id="ability-btn-name">✨ قابلیت ویژه</span>
                    <span class="btn-subtext" id="ability-btn-desc">مهارت اختصاصی</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    document.addEventListener('contextmenu', e => e.preventDefault());

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        try {
            initAudio();
            if (navigator.vibrate) navigator.vibrate(type === 'ability' ? [50, 30, 80] : 40);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'ability') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'defend') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(240, now + 0.2);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        } catch (e) {}
    }

    // --- CHARACTER DATA BASED ON GDD ---
    const CHARACTERS = [
        { id: 'borzu', name: 'برزو', bodyType: 'big', role: 'tank_poison', hp: 140, attack: 28, mana: 100, speed: 4, img: 'borzu.png', abilityName: 'تاچ منحرفانه', abilityDesc: 'سمی کردن دشمن (مانا ۷۰)', manaCost: 70, cd: 2 },
        { id: 'mirbozorg', name: 'میربزرگ', bodyType: 'thin', role: 'disruptor', hp: 110, attack: 24, mana: 90, speed: 7, img: 'mirbozorg.png', abilityName: 'همیشه دیر می‌رسه', abilityDesc: 'تاخیر انداختن به حریف (مانا ۵۰)', manaCost: 50, cd: 2 },
        { id: 'iman', name: 'ایمان', bodyType: 'big', role: 'fast_fighter', hp: 125, attack: 26, mana: 80, speed: 8, img: 'iman.png', abilityName: 'دوندست', abilityDesc: 'جای‌خالی دادن و Dodge (مانا ۴۰)', manaCost: 40, cd: 2 },
        { id: 'pourya', name: 'پوریا', bodyType: 'thin', role: 'splash_dps', hp: 100, attack: 25, mana: 100, speed: 6, img: 'pourya.png', abilityName: 'نقاش', abilityDesc: 'حمله گروهی Splash (مانا ۶۰)', manaCost: 60, cd: 2 },
        { id: 'hejazi', name: 'حجازی', bodyType: 'medium', role: 'support', hp: 120, attack: 22, mana: 100, speed: 5, img: 'hejazi.png', abilityName: 'تقویت یاران', abilityDesc: 'افزایش اتک هم‌تیمی‌ها (مانا ۵۰)', manaCost: 50, cd: 2 },
        { id: 'mahan', name: 'ماهان', bodyType: 'thin', role: 'burst_dps', hp: 105, attack: 32, mana: 80, speed: 7, img: 'mahan.png', abilityName: 'اتک سنگین', abilityDesc: 'ضربه ۲برابر (مانا ۶۰، Cooldown 2)', manaCost: 60, cd: 2 },
        { id: 'teacher', name: 'تیچر', bodyType: 'thin', role: 'high_dps', hp: 110, attack: 28, mana: 90, speed: 7, img: 'teacher.png', abilityName: 'بدون خطا', abilityDesc: 'بدون میس و حمله دوگانه (مانا ۶۰)', manaCost: 60, cd: 2 },
        { id: 'komyl', name: 'کمیل', bodyType: 'big', role: 'tank_debuffer', hp: 150, attack: 22, mana: 80, speed: 3, img: 'komyl.png', abilityName: 'بطری عرق', abilityDesc: '۵۰٪ شانس میس حریف (مانا ۵۰)', manaCost: 50, cd: 3 },
        { id: 'hooman', name: 'هومن', bodyType: 'medium', role: 'trickster', hp: 115, attack: 24, mana: 90, speed: 6, img: 'hooman.png', abilityName: 'قابلیت مخفی', abilityDesc: 'پنهان‌سازی اطلاعات (مانا ۴۰)', manaCost: 40, cd: 2 }
    ];

    let isMultiplayer = false;
    let peer = null;
    let conn = null;

    let selectedIds = [];
    let enemySelectedIds = [];
    let gameState = {
        player: [],
        enemy: [],
        turnQueue: [],
        currentTurn: null,
        target: null,
        isBusy: false
    };

    function triggerShake() {
        const arena = document.getElementById('game-screen');
        arena.classList.add('shake');
        setTimeout(() => arena.classList.remove('shake'), 300);
    }

    function switchScene(sceneId) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById(sceneId).classList.add('active');
    }

    function initMode(mode) {
        initAudio();
        isMultiplayer = (mode === 'multi');
        switchScene('select-scene');
        renderRoster();
    }

    function createRoom() {
        initAudio();
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('room-status').innerText = 'در حال ساخت اتاق...';
        if (peer) peer.destroy();
        
        peer = new Peer('warrior-' + code);
        peer.on('open', () => {
            document.getElementById('room-status').innerText = `کد اتاق: ${code} (منتظر حریف...)`;
        });
        peer.on('connection', (c) => {
            conn = c;
            setupMultiplayerEvents();
        });
    }

    function joinRoom() {
        initAudio();
        const code = document.getElementById('room-code-input').value.trim();
        if (code.length !== 6) return alert('کد ۶ رقمی را وارد کنید!');
        document.getElementById('room-status').innerText = 'در حال اتصال...';
        if (peer) peer.destroy();
        
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect('warrior-' + code);
            setupMultiplayerEvents();
        });
    }

    function setupMultiplayerEvents() {
        conn.on('open', () => {
            document.getElementById('room-status').innerText = 'متصل شد!';
            setTimeout(() => initMode('multi'), 400);
        });

        conn.on('data', (data) => {
            if (data.type === 'team_selected') {
                enemySelectedIds = data.ids;
                checkMultiplayerStart();
            } else if (data.type === 'action') {
                executeActionFromNetwork(data.action, data.targetId);
            }
        });
    }

    function renderRoster() {
        const rosterEl = document.getElementById('roster');
        rosterEl.innerHTML = '';
        CHARACTERS.forEach(char => {
            const card = document.createElement('div');
            card.className = `card ${selectedIds.includes(char.id) ? 'selected' : ''}`;
            card.onclick = () => toggleSelect(char.id, card);
            card.innerHTML = `
                <img src="${char.img}">
                <div class="card-name">${char.name}</div>
                <div class="card-ability">✨ ${char.abilityName}</div>
            `;
            rosterEl.appendChild(card);
        });
    }

    function toggleSelect(id, cardEl) {
        if (selectedIds.includes(id)) {
            selectedIds = selectedIds.filter(i => i !== id);
            cardEl.classList.remove('selected');
        } else if (selectedIds.length < 3) {
            selectedIds.push(id);
            cardEl.classList.add('selected');
        }

        const btn = document.getElementById('start-btn');
        if (selectedIds.length === 3) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    function confirmTeam() {
        if (selectedIds.length !== 3) return;

        if (!isMultiplayer) {
            const pool = CHARACTERS.filter(c => !selectedIds.includes(c.id)).map(c => c.id);
            enemySelectedIds = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
            startBattle();
        } else {
            conn.send({ type: 'team_selected', ids: selectedIds });
            switchScene('landing-scene');
            document.getElementById('room-status').innerText = 'منتظر انتخاب تیم حریف...';
            checkMultiplayerStart();
        }
    }

    function checkMultiplayerStart() {
        if (selectedIds.length === 3 && enemySelectedIds.length === 3) {
            startBattle();
        }
    }

    function startBattle() {
        gameState.player = selectedIds.map(id => createFighterInstance(id, 'player'));
        gameState.enemy = enemySelectedIds.map(id => createFighterInstance(id, 'enemy'));

        switchScene('battle-scene');
        initTurnSystem();
    }

    function createFighterInstance(id, team) {
        const base = CHARACTERS.find(c => c.id === id);
        return {
            ...base,
            team,
            maxHp: base.hp,
            currentHp: base.hp,
            currentMana: base.mana,
            maxMana: base.mana,
            cooldown: 0,
            isDefending: false,
            poisonTurns: 0,
            isDodging: false
        };
    }

    function initTurnSystem() {
        buildTurnQueue();
        nextTurn();
    }

    function buildTurnQueue() {
        const all = [...gameState.player, [...gameState.enemy]].flat().filter(f => f.currentHp > 0);
        all.sort((a, b) => b.speed - a.speed);
        gameState.turnQueue = all;
    }

    function nextTurn() {
        if (checkEndGame()) return;

        if (gameState.turnQueue.length === 0) buildTurnQueue();

        gameState.currentTurn = gameState.turnQueue.shift();

        if (!gameState.currentTurn || gameState.currentTurn.currentHp <= 0) {
            nextTurn();
            return;
        }

        const curr = gameState.currentTurn;
        curr.isDefending = false;
        curr.isDodging = false;

        if (curr.cooldown > 0) curr.cooldown--;
        curr.currentMana = Math.min(curr.maxMana, curr.currentMana + 15); // Turn Mana Recovery

        // Poison effect processing
        if (curr.poisonTurns > 0) {
            const poisonDmg = 15;
            curr.currentHp = Math.max(0, curr.currentHp - poisonDmg);
            curr.poisonTurns--;
            showPopText(document.getElementById(`fighter-${curr.team}-${curr.id}`), `☠ -${poisonDmg}`, '#2ed573');
        }

        if (curr.team === 'player') {
            const aliveEnemies = gameState.enemy.filter(e => e.currentHp > 0);
            if (!gameState.target || gameState.target.currentHp <= 0) {
                gameState.target = aliveEnemies[0] || null;
            }
        }

        gameState.isBusy = false;
        renderArena();
        updateControls();

        if (!isMultiplayer && curr.team === 'enemy') {
            gameState.isBusy = true;
            setTimeout(enemyAITurn, 800);
        }
    }

    function renderArena() {
        const pCol = document.getElementById('player-team');
        const eCol = document.getElementById('enemy-team');
        pCol.innerHTML = '';
        eCol.innerHTML = '';

        gameState.player.forEach(f => pCol.appendChild(createFighterDOM(f)));
        gameState.enemy.forEach(f => eCol.appendChild(createFighterDOM(f)));

        const banner = document.getElementById('status-text');
        if (gameState.currentTurn) {
            banner.innerText = gameState.currentTurn.team === 'player' 
                ? `نوبت شما: ${gameState.currentTurn.name}` 
                : `نوبت حریف: ${gameState.currentTurn.name}`;
        }
    }

    function createFighterDOM(f) {
        const wrap = document.createElement('div');
        const isActive = gameState.currentTurn === f;
        const isTarget = gameState.target === f && f.team === 'enemy';

        wrap.className = `full-character ${isActive ? 'active-turn' : ''} ${isTarget ? 'target-selected' : ''}`;
        if (f.currentHp <= 0) wrap.style.opacity = '0.2';

        wrap.onclick = () => {
            if (f.currentHp <= 0 || gameState.isBusy) return;
            if (gameState.currentTurn && gameState.currentTurn.team === 'player' && f.team === 'enemy') {
                gameState.target = f;
                renderArena();
            }
        };

        const hpPct = Math.max(0, (f.currentHp / f.maxHp) * 100);
        const manaPct = Math.max(0, (f.currentMana / f.maxMana) * 100);

        wrap.innerHTML = `
            <div class="char-hud">
                <span class="char-name-label">${f.name}</span>
                <div class="bar-bg"><div class="hp-fill" style="width:${hpPct}%"></div></div>
                <div class="bar-bg"><div class="mana-fill" style="width:${manaPct}%"></div></div>
            </div>
            <div class="char-sprite-wrap">
                <img class="char-sprite" src="${f.img}" alt="${f.name}">
                <div class="shadow-ellipse"></div>
            </div>
        `;

        wrap.id = `fighter-${f.team}-${f.id}`;
        return wrap;
    }

    function updateControls() {
        const curr = gameState.currentTurn;
        const isMyTurn = curr && curr.team === 'player' && !gameState.isBusy;

        document.getElementById('btn-atk').disabled = !isMyTurn;
        document.getElementById('btn-def').disabled = !isMyTurn;
        
        const abiBtn = document.getElementById('btn-ability');
        const nameLabel = document.getElementById('ability-btn-name');
        const descLabel = document.getElementById('ability-btn-desc');

        if (curr && curr.team === 'player') {
            nameLabel.innerText = `✨ ${curr.abilityName}`;
            descLabel.innerText = curr.abilityDesc;
        }

        if (!isMyTurn) {
            abiBtn.disabled = true;
        } else if (curr.cooldown > 0 || curr.currentMana < curr.manaCost) {
            abiBtn.disabled = true;
            if (curr.cooldown > 0) nameLabel.innerText = `⏳ ${curr.abilityName} (${curr.cooldown})`;
            else nameLabel.innerText = `💧 مانای ناکافی (${curr.abilityName})`;
        } else {
            abiBtn.disabled = false;
        }
    }

    function handleAction(type) {
        if (gameState.isBusy || !gameState.currentTurn || gameState.currentTurn.team !== 'player') return;
        gameState.isBusy = true;
        updateControls();

        const attacker = gameState.currentTurn;
        const target = gameState.target;

        if (isMultiplayer && conn) {
            conn.send({ type: 'action', action: type, targetId: target ? target.id : null });
        }

        executeActionLogic(attacker, target, type);
    }

    function executeActionFromNetwork(actionType, targetId) {
        const attacker = gameState.currentTurn;
        let target = gameState.player.find(p => p.id === targetId) || gameState.player.find(p => p.currentHp > 0);
        executeActionLogic(attacker, target, actionType);
    }

    function executeActionLogic(attacker, target, actionType) {
        if (actionType === 'defend') {
            attacker.isDefending = true;
            playSound('defend');
            showPopText(document.getElementById(`fighter-${attacker.team}-${attacker.id}`), '🛡️ دفاع', '#00d2d3');
            setTimeout(nextTurn, 700);
            return;
        }

        const attackerEl = document.getElementById(`fighter-${attacker.team}-${attacker.id}`);
        const targetEl = document.getElementById(`fighter-${target.team}-${target.id}`);
        const isAbility = (actionType === 'ability');

        // Check Team Synergy: Teacher & Hooman
        let synergyDmgBoost = 1.0;
        const teamComps = attacker.team === 'player' ? gameState.player : gameState.enemy;
        if (teamComps.some(c => c.id === 'teacher') && teamComps.some(c => c.id === 'hooman')) {
            synergyDmgBoost = 1.2; // 20% team synergy boost
        }

        // Check Komeil Team Penalty (10% miss chance for teammates)
        let missChance = 0;
        if (teamComps.some(c => c.id === 'komyl')) {
            missChance += 0.10;
        }

        // Check Target Dodge (Iman's Ability)
        if (target.isDodging && Math.random() < 0.5) {
            showPopText(targetEl, 'DODGE!', '#3498db');
            setTimeout(nextTurn, 700);
            return;
        }

        if (Math.random() < missChance) {
            showPopText(attackerEl, 'MISS!', '#ff4757');
            setTimeout(nextTurn, 700);
            return;
        }

        if (isAbility && attackerEl) {
            attacker.currentMana -= attacker.manaCost;
            attacker.cooldown = attacker.cd;
            attackerEl.classList.add('using-ability');
            showPopText(attackerEl, `✨ ${attacker.abilityName}`, '#9b59b6');
        }

        const animClass = attacker.team === 'player' ? 'attack-up-anim' : 'attack-down-anim';
        if (attackerEl) attackerEl.classList.add(animClass);

        setTimeout(() => {
            if (targetEl) targetEl.classList.add('hurt-anim');
            playSound(isAbility ? 'ability' : 'hit');
            triggerShake();

            let dmg = isAbility ? Math.round(attacker.attack * 1.8 * synergyDmgBoost) : Math.round(attacker.attack * synergyDmgBoost);

            // Borzu Bonus Damage vs Thin body types
            if (attacker.id === 'borzu' && target.bodyType === 'thin') {
                dmg = Math.round(dmg * 1.35);
            }

            // Mirbozorg & Hejazi mutual relationship damage boost
            if ((attacker.id === 'mirbozorg' && target.id === 'hejazi') || (attacker.id === 'hejazi' && target.id === 'mirbozorg')) {
                dmg = Math.round(dmg * 1.25);
            }

            // Iman & Pourya mutual relationship damage boost
            if ((attacker.id === 'iman' && target.id === 'pourya') || (attacker.id === 'pourya' && target.id === 'iman')) {
                dmg = Math.round(dmg * 1.25);
            }

            // Special Ability Custom Mechanics implementation
            if (isAbility) {
                if (attacker.id === 'borzu') {
                    target.poisonTurns = 2; // Apply Poison status
                } else if (attacker.id === 'iman') {
                    attacker.isDodging = true;
                } else if (attacker.id === 'hejazi') {
                    teamComps.forEach(member => member.attack = Math.round(member.attack * 1.2)); // Buff team
                }
            }

            if (target.isDefending) dmg = Math.round(dmg * 0.5);

            target.currentHp = Math.max(0, target.currentHp - dmg);
            showPopText(targetEl, `-${dmg}`, isAbility ? '#9b59b6' : '#ff3838');

            setTimeout(() => {
                if (targetEl) targetEl.classList.remove('hurt-anim');
            }, 350);

        }, 250);

        setTimeout(() => {
            if (attackerEl) {
                attackerEl.classList.remove(animClass);
                attackerEl.classList.remove('using-ability');
            }
            renderArena();
            nextTurn();
        }, 750);
    }

    function enemyAITurn() {
        const attacker = gameState.currentTurn;
        const alivePlayers = gameState.player.filter(p => p.currentHp > 0);
        if (!alivePlayers.length) return;

        const target = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
        const useAbility = attacker.cooldown === 0 && attacker.currentMana >= attacker.manaCost && Math.random() < 0.5;

        executeActionLogic(attacker, target, useAbility ? 'ability' : 'attack');
    }

    function showPopText(targetEl, text, color) {
        if (!targetEl) return;
        const rect = targetEl.getBoundingClientRect();
        const pop = document.createElement('div');
        pop.className = 'pop-dmg';
        pop.innerText = text;
        pop.style.color = color;
        pop.style.left = `${rect.left + (rect.width / 2) - 30}px`;
        pop.style.top = `${rect.top - 10}px`;
        document.body.appendChild(pop);

        setTimeout(() => pop.remove(), 1100);
    }

    function checkEndGame() {
        const pAlive = gameState.player.some(p => p.currentHp > 0);
        const eAlive = gameState.enemy.some(e => e.currentHp > 0);

        if (!eAlive && gameState.player.length > 0) {
            alert('🎉 تبریک! تیم رفقای شما پیروز این نبرد شد.');
            location.reload();
            return true;
        } else if (!pAlive && gameState.enemy.length > 0) {
            alert('💀 متاسفانه تمام رفقای شما شکست خوردند!');
            location.reload();
            return true;
        }
        return false;
    }
</script>
